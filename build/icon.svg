<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c28b"/>
      <stop offset="1" stop-color="#d9714b"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb7e6"/>
      <stop offset="1" stop-color="#cfe8f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5a2410" flood-opacity="0.35"/>
    </filter>
    <clipPath id="photo"><rect x="-250" y="-250" width="500" height="410" rx="6"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- задняя карточка -->
  <g transform="translate(560 540) rotate(9)">
    <rect x="-270" y="-300" width="540" height="600" rx="14" fill="#fff6e8" filter="url(#shadow)"/>
    <rect x="-235" y="-265" width="470" height="440" rx="8" fill="#e9c9a0"/>
  </g>

  <!-- передняя карточка с фото -->
  <g transform="translate(470 560) rotate(-7)">
    <rect x="-290" y="-320" width="580" height="640" rx="14" fill="#ffffff" filter="url(#shadow)"/>
    <g transform="translate(0 -60)" clip-path="url(#photo)">
      <rect x="-250" y="-250" width="500" height="410" fill="url(#sky)"/>
      <circle cx="120" cy="-130" r="52" fill="#ffd45e"/>
      <path d="M-250 80 L-120 -60 L-10 60 L90 -30 L250 110 L250 160 L-250 160 Z" fill="#6fa36a"/>
      <path d="M-250 120 Q-100 40 40 110 T250 100 L250 160 L-250 160 Z" fill="#4f8a58"/>
    </g>
    <!-- уголки для фото -->
    <path d="M-250 -310 h70 l-70 70 z" fill="#c9553a"/>
    <path d="M250 -310 h-70 l70 70 z" fill="#c9553a"/>
    <!-- подпись -->
    <path d="M-190 215 q40 -34 80 0 t80 0 t80 0 t80 0" fill="none" stroke="#b9876a" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- скотч -->
  <g transform="translate(560 235) rotate(-14)">
    <rect x="-120" y="-34" width="240" height="68" fill="#8fd3c2" opacity="0.88"/>
    <path d="M-120 -34 l-12 8 l12 8 l-12 8 l12 8 l-12 8 l12 8 v-48 z" fill="#8fd3c2" opacity="0.88"/>
    <path d="M120 -34 l12 8 l-12 8 l12 8 l-12 8 l12 8 l-12 8 v-48 z" fill="#8fd3c2" opacity="0.88"/>
  </g>
</svg>
